[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threadsense"
version = "0.1.0"
description = "Thread analysis with Slack fixture adapters"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "crewai[litellm]>=1.15.27,<2",
    "numpy>=2.5.4",
    "pydantic>=2.0,<3",
    "scikit-learn>=1.2",
    "sentence-transformers>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["threadsense*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
cache_dir = ".cache/pytest"
